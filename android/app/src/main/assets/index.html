<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoAn Booth | Your Premium Photo Booth</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Pacifico&family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    <!-- Include html2canvas for capturing the card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">📸</span>
                <h1>SoAn Booth</h1>
            </div>
            <p>Capture your aesthetic. 6 shots, 1 beautiful memory card.</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Left Panel: Camera & Tools -->
            <section class="panel camera-panel glass">
                <div class="video-container" id="video-container">
                    <!-- Standard video feed -->
                    <video id="webcam" autoplay playsinline></video>
                    <!-- Invisible canvas for capturing -->
                    <canvas id="hidden-canvas" style="display:none;"></canvas>
                    <!-- Flash effect element -->
                    <div id="flash" class="flash"></div>
                </div>

                <div class="controls">
                    <button id="capture-btn" class="primary-btn">
                        <span class="btn-icon">✨</span>Capture Photo (<span id="photo-count">0</span>/6)
                    </button>
                    <div style="display: flex; gap: 10px;">
                        <button id="flip-camera-btn" class="secondary-btn" style="flex: 1;">
                            🔄 Flip Camera
                        </button>
                        <label class="secondary-btn upload-btn" style="flex: 1;">
                            📁 Upload Photo
                            <input type="file" id="upload-input" accept="image/*" hidden>
                        </label>
                    </div>
                </div>

                <div class="filters-section">
                    <h3>Snap Filters ✨</h3>
                    <div class="filters-scroll" id="filters-list">
                        <!-- Filter buttons will be generated by JS -->
                    </div>
                </div>
            </section>

            <!-- Right Panel: Card Preview -->
            <section class="panel preview-panel glass">
                <div class="card-wrapper-container">
                    <!-- The Printable Card -->
                    <div class="card" id="print-card">
                        <div class="card-header">
                            <h2 contenteditable="true" spellcheck="false" title="Click to edit text">SoAn Booth</h2>
                            <p class="subtitle" contenteditable="true" spellcheck="false" title="Click to edit text">Sweet Memory</p>
                        </div>
                        
                        <!-- 2x3 Grid -->
                        <div class="photo-grid" id="photo-grid">
                            <div class="photo-slot empty" data-index="0"></div>
                            <div class="photo-slot empty" data-index="1"></div>
                            <div class="photo-slot empty" data-index="2"></div>
                            <div class="photo-slot empty" data-index="3"></div>
                            <div class="photo-slot empty" data-index="4"></div>
                            <div class="photo-slot empty" data-index="5"></div>
                        </div>

                        <div class="card-footer">
                            <p class="date" id="current-date" contenteditable="true" spellcheck="false" title="Click to edit"></p>
                            <p class="branding" contenteditable="true" spellcheck="false" title="Click to edit">Made with ♥</p>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="download-btn" class="primary-btn action-btn">
                        ⬇️ Download Card
                    </button>
                    <button id="print-btn" class="secondary-btn action-btn">
                        🖨️ Print
                    </button>
                    <button id="reset-btn" class="danger-btn action-btn">
                        🗑️ Reset All
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
